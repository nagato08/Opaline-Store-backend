name: CI/CD

# `verify` tourne sur chaque push et chaque pull request : c'est le filet qui
# doit attraper une erreur avant qu'elle parte en production, pas après.
# `build` et `deploy` ne se déclenchent qu'après son succès, et seulement sur
# `main` — une branche de travail ne doit jamais pouvoir toucher le VPS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un déploiement en cours n'est jamais interrompu par le suivant : ils
# s'enchaînent, ils ne se chevauchent pas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/opaline-api
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/opaline-api-migrator

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Base éphémère pour rejouer les migrations à blanc. C'est le même geste
    # qu'une première installation sur le VPS : si une migration casse ici,
    # elle aurait cassé là-bas.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opaline
          POSTGRES_PASSWORD: opaline
          POSTGRES_DB: opaline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opaline -d opaline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opaline:opaline@localhost:5432/opaline?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Le client doit exister avant toute compilation : le code l'importe
      # depuis `src/generated`.
      - run: npx prisma generate

      # Sans `--fix` : la CI vérifie, elle ne corrige pas silencieusement à la
      # place de l'auteur du commit.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      # `nest build` type-check et compile en une passe — c'est exactement ce
      # que fait l'image Docker, pas la peine de dupliquer un `tsc --noEmit`.
      - name: Build
        run: npm run build

      # Applique toutes les migrations sur une base neuve : c'est le geste
      # qu'un premier déploiement ferait, avant qu'il ne le fasse pour de vrai.
      - name: Migrations à blanc
        run: npx prisma migrate deploy

  # Construit les deux images (runtime et migrateur) et les pousse sur GHCR.
  # Le VPS ne construit plus rien lui-même : il se contente de tirer une image
  # déjà prête, ce qui laisse sa mémoire aux services qui tournent déjà dessus.
  build:
    name: Construire et publier les images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image migrateur
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:latest
            ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      # Le VPS tire les images tout juste publiées et redémarre les services
      # concernés — aucune construction locale, aucun `git pull` nécessaire
      # côté VPS pour ce qui touche l'image elle-même.
      - name: Tirer les images et redémarrer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker image prune -f

      # nginx-proxy-manager route déjà `api.opaline.tadjo.dev` vers le
      # conteneur `opaline-api` ; on vérifie ici depuis l'extérieur que le
      # nouveau conteneur a bien démarré et répond.
      - name: Vérifier que l'API répond
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.API_DOMAIN }}/api/health/live")
            if [ "$code" = "200" ]; then
              echo "API saine (${code})"
              exit 0
            fi
            echo "Tentative $i : ${code:-échec}, nouvelle tentative dans 5 s"
            sleep 5
          done
          echo "::error::L'API ne répond pas après déploiement"
          exit 1
